<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PakDeals Saudi Arabia - Best Amazon & CJ Deals</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

  <!-- TOP NAVBAR -->
  <header class="bg-[#131921] text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2 md:gap-4">
      <!-- Brand Logo -->
      <a href="#" class="text-xl md:text-2xl font-black tracking-tight text-white flex items-center gap-0.5 shrink-0">
        PakDeals<span class="text-[#FF9900] text-xs font-bold">.sa</span>
      </a>

      <!-- Location -->
      <div class="hidden sm:flex items-center gap-1.5 text-xs text-gray-300 shrink-0">
        <i class="fa-solid fa-location-dot text-[#FF9900] text-sm"></i>
        <div class="leading-tight">
          <span class="block text-[10px] text-gray-400">Deliver to</span>
          <span class="font-bold text-white">Saudi Arabia 🇸🇦</span>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl flex rounded-lg overflow-hidden bg-white text-gray-800 shadow-sm border border-transparent">
        <select id="categorySelect" class="bg-gray-200 hover:bg-gray-300 text-xs px-2 text-gray-700 outline-none">
          <option value="all">All</option>
          <option value="abaya">Abayas & Modest</option>
          <option value="bags">Bags & Totes</option>
          <option value="men-fashion">Men's Fashion</option>
          <option value="mobile-accessories">Mobile Accessories</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search products..." class="w-full px-3 py-1.5 text-sm outline-none">
        <button class="bg-[#FF9900] hover:bg-[#F3A847] text-slate-900 px-4 font-bold text-sm">
          <i class="fa-solid fa-magnifying-glass text-slate-900"></i>
        </button>
      </div>

      <div class="sm:hidden text-xs font-bold text-[#FF9900] shrink-0">🇸🇦 SA</div>
    </div>

    <!-- Category Strip -->
    <nav class="bg-[#232F3E] text-xs px-3 py-2 overflow-x-auto whitespace-nowrap border-t border-slate-700">
      <div class="max-w-7xl mx-auto flex items-center gap-4 text-gray-200">
        <button class="category-btn active hover:text-[#FF9900] font-semibold text-[#FF9900]">All Deals</button>
        <button class="category-btn hover:text-[#FF9900]"><i class="fa-solid fa-shirt mr-1"></i>Abayas</button>
        <button class="category-btn hover:text-[#FF9900]"><i class="fa-solid fa-bag-shopping mr-1"></i>Bags</button>
        <button class="category-btn hover:text-[#FF9900]"><i class="fa-solid fa-user-large mr-1"></i>Men's Fashion</button>
        <button class="category-btn hover:text-[#FF9900]"><i class="fa-solid fa-mobile-screen mr-1"></i>Mobile Accessories</button>
      </div>
    </nav>
  </header>

  <!-- HERO BANNER -->
  <section class="max-w-7xl mx-auto px-3 mt-4 w-full">
    <div class="relative rounded-2xl overflow-hidden shadow-nd bg-gradient-to-r from-[#131921] via-[#232F3E] to-[#0F1111] p-6 md:p-10 text-white">
      <div class="relative z-10 max-w-xl">
        <span class="inline-block bg-[#FF9900] text-slate-900 text-[11px] font-black uppercase px-2.5 py-0.5 rounded-full mb-2">Featured Products</span>
        <h1 class="text-xl md:text-3xl font-extrabold tracking-tight text-white">Trending Deals & Fashion Essentials</h1>
        <p class="text-gray-300 text-xs md:text-sm mt-1">Direct products with fast shipping and best prices!</p>
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT AREA -->
  <main class="max-w-7xl mx-auto px-3 py-6 w-full flex-1">
    
    <!-- CJ PRODUCTS CONTAINER (AUTO LOADS PRODUCTS) -->
    <div id="cj-products-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Loading State -->
      <div class="col-span-full text-center py-12">
        <p class="text-gray-500 font-medium">Loading products from CJ...</p>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-[#131921] text-gray-400 text-xs py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-3 text-center">
      <p>© 2026 PakDeals.sa - All rights reserved.</p>
    </div>
  </footer>

  <!-- BACKEND FETCH SCRIPT -->
  <script>
    async function loadCJProducts() {
      const container = document.getElementById('cj-products-container');
      if (!container) return;

      try {
        const response = await fetch('/api/cj');
        const result = await response.json();

        // Check if data exists in CJ response
        if (result && result.data && result.data.list && result.data.list.length > 0) {
          container.innerHTML = result.data.list.map(product => `
            <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow p-3 flex flex-col justify-between border border-gray-100">
              <div class="overflow-hidden rounded-lg bg-gray-50 mb-3 h-44 flex items-center justify-center">
                <img src="${product.productImage || 'https://via.placeholder.com/200'}" alt="${product.productNameEn}" class="h-full w-full object-cover">
              </div>
              <div class="flex-1 flex flex-col justify-between">
                <div>
                  <h3 class="font-semibold text-xs text-gray-800 line-clamp-2 mb-1">${product.productNameEn}</h3>
                </div>
                <div class="mt-2">
                  <span class="text-sm font-bold text-emerald-600">$${product.sellPrice}</span>
                  <a href="${product.productUrl || '#'}" target="_blank" class="mt-2 block w-full bg-[#FF9900] hover:bg-[#F3A847] text-slate-900 text-center font-bold text-xs py-2 rounded-lg transition-colors">
                    View Product
                  </a>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="col-span-full text-center py-8">
              <p class="text-gray-500 font-medium">No CJ products found. Please verify API configuration.</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error fetching CJ products:', error);
        container.innerHTML = `
          <div class="col-span-full text-center py-8">
            <p class="text-red-500 font-medium">Failed to load products. Check backend API logs.</p>
          </div>
        `;
      }
    }

    // Auto trigger on page load
    document.addEventListener('DOMContentLoaded', loadCJProducts);
  </script>

</body>
</html>
