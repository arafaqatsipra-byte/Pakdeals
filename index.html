<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #f7f9fc; color: #1e293b; direction: rtl; }
    header { background-color: #1e2329; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.5rem; }
    header p { font-size: 0.85rem; color: #a0aec0; }
    .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 1px solid #e2e8f0; }
    .img-container { width: 100%; height: 230px; background-color: #edf2f7; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .title { font-size: 1rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
    .price-tag { font-size: 1.2rem; font-weight: 800; color: #27ae60; margin-bottom: 12px; }
    .wa-button { display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; transition: background 0.2s ease; }
    .wa-button:hover { background-color: #1ebc57; }
    .loading-message { text-align: center; grid-column: 1 / -1; padding: 40px; color: #718096; }
    footer { text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>متجرنا الإلكتروني</h1>
    <p>اطلب مباشرة عبر الواتساب</p>
  </header>

  <div class="container">
    <div id="products-container" class="products-grid">
      <div class="loading-message">جاري تحميل المنتجات...</div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 All Rights Reserved.</p>
  </footer>

  <script>
    // ⚠️ Apna WhatsApp Number yahan daalein
    const WHATSAPP_NUMBER = "966500000000";

    fetch('products.json')
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(products => {
        const container = document.getElementById('products-container');
        if (!products || products.length === 0) {
          container.innerHTML = '<div class="loading-message">لا توجد منتجات حالياً.</div>';
          return;
        }

        let html = '';
        products.forEach(product => {
          const msg = product.whatsapp_message || `Hello, I want to order ${product.title}`;
          const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

          html += `
            <div class="product-card">
              <div class="img-container">
                <img src="${product.image}" alt="${product.title}" loading="lazy">
              </div>
              <div class="card-content">
                <div>
                  <h3 class="title">${product.title}</h3>
                  <div class="price-tag">${product.price}</div>
                </div>
                <a href="${waLink}" target="_blank" class="wa-button">
                  طلب عبر الواتساب
                </a>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('products-container').innerHTML = 
          '<div class="loading-message" style="color: #e53e3e;">خطأ في تحميل المنتجات</div>';
      });
  </script>
</body>
</html>
