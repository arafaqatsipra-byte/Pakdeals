<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store - Direct Dropshipping Store</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #1a1d20;
    }

    /* Top Announcement Bar */
    .top-bar {
      background-color: #ff6600;
      color: #ffffff;
      text-align: center;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Header Styling */
    header {
      background-color: #1e2329;
      color: #ffffff;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ff6600;
      text-decoration: none;
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #1e2329 0%, #2b313a 100%);
      color: #ffffff;
      text-align: center;
      padding: 35px 20px;
      border-bottom: 3px solid #ff6600;
    }
    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .hero p {
      color: #a0aec0;
      font-size: 0.95rem;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* Ecommerce Card Design */
    .product-card {
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #e2e8f0;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border-color: #ff6600;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff6600;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .img-box {
      width: 100%;
      height: 220px;
      background-color: #f8fafc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .img-box img {
      transform: scale(1.05);
    }

    .card-details {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
      line-height: 1.4;
      height: 2.8em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .rating {
      color: #f59e0b;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .price {
      font-size: 1.3rem;
      font-weight: 800;
      color: #e53e3e;
    }
    .shipping-info {
      font-size: 0.75rem;
      color: #38a169;
      background: #f0fff4;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      display: inline-block;
      width: fit-content;
      font-weight: 600;
    }

    .wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }
    .wa-btn:hover {
      background-color: #1ebc57;
    }

    /* Footer */
    footer {
      background: #1e2329;
      color: #a0aec0;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      font-size: 0.85rem;
      border-top: 2px solid #ff6600;
    }

    .loading-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #718096;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">⚡ توصيل سريع لجميع مناطق المملكة العربية السعودية | الدفع عند الطلب عبر الواتساب</div>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">🛒 STORE SHOP</a>
      <span style="font-size: 0.85rem; background: #ff6600; padding: 4px 10px; border-radius: 20px; font-weight: bold;">Direct Store</span>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>أحدث المنتجات والعروض الحصرية</h1>
    <p>تصفح منتجاتنا المميزة واطلب مباشرة بسهولة</p>
  </section>

  <!-- Products Grid -->
  <div class="container">
    <div id="products-container" class="products-grid">
      <div class="loading-msg">جاري تحميل المنتجات...</div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 All Rights Reserved. Direct Shopping via WhatsApp.</p>
  </footer>

  <!-- Script -->
  <script>
    // ⚠️ APNA WHATSAPP NUMBER YAHAN DALEIN (Saudi Code 966 Ke Sath, Bina + Ke)
    const WHATSAPP_NUMBER = "966500000000";

    // Image Proxy helper function to fix CJ Image Loading issues
    function getSafeImageUrl(url) {
      if (!url) return 'https://via.placeholder.com/300x300?text=No+Image';
      if (url.includes('cc-west-usa.oss-us-west-1.aliyuncs.com') || url.includes('cjdropshipping.com')) {
        return 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
      }
      return url;
    }

    fetch('products.json')
      .then(response => {
        if (!response.ok) throw new Error('Could not load products.json');
        return response.json();
      })
      .then(products => {
        const container = document.getElementById('products-container');
        if (!products || products.length === 0) {
          container.innerHTML = '<div class="loading-msg">لا توجد منتجات حالياً.</div>';
          return;
        }

        let html = '';
        products.forEach(p => {
          const safeImg = getSafeImageUrl(p.image);
          const msg = p.whatsapp_message || `السلام عليكم، أود طلب المنتج: ${p.title}`;
          const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

          html += `
            <div class="product-card">
              <span class="badge">Hot Product</span>
              <div class="img-box">
                <img src="${safeImg}" alt="${p.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=Image+Unavailable';">
              </div>
              <div class="card-details">
                <div>
                  <h3 class="title">${p.title}</h3>
                  <div class="rating">★★★★★ (4.9)</div>
                  <div class="price-row">
                    <span class="price">${p.price}</span>
                  </div>
                  <div class="shipping-info">✓ شحن سريع - متوفر بالمخزن</div>
                </div>
                <a href="${waLink}" target="_blank" class="wa-btn">
                  طلب عبر الواتساب
                </a>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      })
      .catch(err => {
        console.error(err);
        document.getElementById('products-container').innerHTML = 
          '<div class="loading-msg" style="color: #e53e3e;">حدث خطأ في تحميل المنتجات. تأكد من صحة ملف products.json</div>';
      });
  </script>
</body>
</html>
