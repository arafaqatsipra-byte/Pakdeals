<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store - High Quality Products</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      direction: rtl;
    }

    /* Header & Banner */
    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    header p {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    /* Container & Layout */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Product Card */
    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .image-container {
      width: 100%;
      height: 240px;
      background-color: #f1f5f9;
      position: relative;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-content {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .price-tag {
      font-size: 1.25rem;
      font-weight: 700;
      color: #16a34a;
      margin-bottom: 8px;
    }
    
    /* Payment Badges (Tabby / Tamara Note) */
    .payment-info {
      font-size: 0.8rem;
      color: #64748b;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px dashed #cbd5e1;
    }

    /* WhatsApp Button */
    .wa-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }
    .wa-button:hover {
      background-color: #1ebc57;
    }

    /* Loading & Error States */
    .state-message {
      text-align: center;
      grid-column: 1 / -1;
      padding: 50px 20px;
      color: #64748b;
      font-size: 1.1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 40px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Top Header Banner -->
  <header>
    <h1>متجرنا الإلكتروني (Online Store)</h1>
    <p>تصفح أفضل المنتجات واطلب مباشرة عبر الواتساب</p>
  </header>

  <!-- Main Content Container -->
  <div class="container">
    <div id="products-container" class="products-grid">
      <div class="state-message">جاري تحميل المنتجات... (Loading Products...)</div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 All Rights Reserved. Easy Direct WhatsApp Ordering.</p>
  </footer>

  <!-- Dynamic Product Script -->
  <script>
    // ⚠️ IMPORTANT: Apna WhatsApp Number yahan Likhein (Saudi Code 966 ke sath, Bina + sign ke)
    const WHATSAPP_NUMBER = "966500000000"; 

    // Fetch Products from JSON
    fetch('products.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Could not load products.json');
        }
        return response.json();
      })
      .then(products => {
        const container = document.getElementById('products-container');

        if (!products || products.length === 0) {
          container.innerHTML = '<div class="state-message">لا توجد منتجات حالياً (No products found).</div>';
          return;
        }

        let htmlContent = '';

        products.forEach(product => {
          // Custom WhatsApp Message Encoding
          const msg = product.whatsapp_message || `السلام عليكم، أود طلب المنتج: ${product.title}`;
          const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

          htmlContent += `
            <div class="product-card">
              <div class="image-container">
                <img src="${product.image}" alt="${product.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image';">
              </div>
              <div class="card-content">
                <div>
                  <h2 class="product-title">${product.title}</h2>
                  <div class="price-tag">${product.price}</div>
                  <div class="payment-info">
                    💡 متوفر الدفع عبر الواتساب (تواصل لمعرفة تفاصيل الشحن)
                  </div>
                </div>
                <a href="${waLink}" target="_blank" class="wa-button">
                  <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12.031 2c-5.517 0-9.993 4.476-9.993 9.993 0 1.763.459 3.479 1.332 4.988l-1.417 5.176 5.299-1.39c1.455.795 3.102 1.218 4.779 1.218 5.517 0 9.993-4.476 9.993-9.993s-4.476-9.992-9.993-9.992zm0 16.5c-1.488 0-2.946-.399-4.218-1.155l-.302-.18-3.131.821.835-3.053-.198-.315c-.832-1.325-1.272-2.868-1.272-4.45 0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8zm4.386-5.992c-.241-.121-1.428-.705-1.649-.785-.221-.08-.382-.121-.543.121-.161.242-.624.785-.765.946-.141.161-.282.181-.523.061-.241-.121-1.02-.376-1.943-1.2-0.718-.641-1.203-1.433-1.344-1.674-.141-.241-.015-.371.106-.491.109-.108.241-.282.362-.423.121-.141.161-.241.241-.403.08-.161.04-.302-.02-.423-.061-.121-.543-1.309-.744-1.792-.196-.471-.397-.406-.543-.414l-.463-.008c-.161 0-.423.061-.644.302s-.846.826-.846 2.015c0 1.189.866 2.338.986 2.499.121.161 1.704 2.602 4.129 3.65.577.249 1.028.398 1.38.51.58.185 1.108.159 1.526.097.466-.07 1.428-.584 1.629-1.149.201-.565.201-1.048.141-1.149-.061-.101-.222-.162-.463-.283z"/>
                  </svg>
                  طلب عبر الواتساب
                </a>
              </div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('products-container').innerHTML = 
          '<div class="state-message" style="color: #ef4444;">عذراً، حدث خطأ أثناء تحميل المنتجات. تأكد من وجود ملف products.json</div>';
      });
  </script>
</body>
</html>
